
services:
  mysql:
    image: mysql:8.0
    container_name: acessolivre-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: acessolivre_db
      MYSQL_USER: acessolivre_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - acessolivre_data:/var/lib/mysql

volumes:
  acessolivre_data:
