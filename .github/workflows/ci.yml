name: AcessoLivre - CI Java

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Java 17 - Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Liberar execucao do Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar, testar e empacotar
        run: ./gradlew --no-daemon clean test bootJar

      - name: Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acessolivre-testes
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn

      - name: Guardar artefato JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: acessolivre-jar
          path: build/libs/*.jar
          if-no-files-found: error
