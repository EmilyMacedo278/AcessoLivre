
spring.application.name=AcessoLivre

# Banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/acessolivre_db
spring.datasource.username=acessolivre_user
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuracao JWT
app.jwt.secret-base64=${JWT_SECRET}


# Spring AI - Google Gemini
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.model.embedding=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}


# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
